[package]
name = "task_domain"
edition = "2024"

[lib]
name = "task_domain"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }

tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
uuid = {version = "1.18.0", features = ["v4", "serde"]}

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
